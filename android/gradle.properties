org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
android.useAndroidX=false
android.nonTransitiveRClass=true
org.gradle.workers.max=2
org.gradle.parallel=false

# ABIs to build. arm64-v8a covers practically every current phone; x86 is for
# PC emulators such as Nox (32-bit Android). Add x86_64 for the Google
# emulator, armeabi-v7a for old 32-bit phones.
sevenkaa.abis=arm64-v8a

# Where SDL2 and OpenAL-soft are downloaded to (outside the repository).
# Relative paths are relative to this android/ folder.
sevenkaa.depsDir=../../7kaa-android-deps
