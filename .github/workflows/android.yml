name: Android APK

# Builds the Android debug APK (see android/README.md) on GitHub's servers and
# uploads it as a workflow artifact named "7kaa-android-apk".

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'src/**'
      - 'include/**'
      - 'data/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.3.13750724" "cmake;3.31.6" > /dev/null

      - name: Cache SDL2 / OpenAL-soft downloads
        uses: actions/cache@v4
        with:
          path: 7kaa-android-deps
          key: deps-${{ hashFiles('android/app/build.gradle') }}

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain \
            -Psevenkaa.depsDir="$GITHUB_WORKSPACE/7kaa-android-deps"

      - uses: actions/upload-artifact@v4
        with:
          name: 7kaa-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
